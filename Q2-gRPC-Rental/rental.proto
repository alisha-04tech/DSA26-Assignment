syntax = "proto3";

package rental;

service RentalService {
    rpc add_property (AddPropertyRequest) returns (AddPropertyResponse);
    rpc create_users (stream UserProfile) returns (CreateUsersResponse);
    rpc update_property (UpdatePropertyRequest) returns (PropertyResponse);
    rpc remove_property (RemovePropertyRequest) returns (PropertyList);
    rpc list_available_properties (ListAvailableRequest) returns (stream Property);
    rpc search_property (SearchPropertyRequest) returns (SearchPropertyResponse);
    rpc book_property (BookPropertyRequest) returns (BookPropertyResponse);
    rpc confirm_booking (ConfirmBookingRequest) returns (BookingConfirmation);
}

// Zero values are named *_UNSPECIFIED so "not set" is distinguishable from a
// real value. The update RPC relies on this.
enum PropertyStatus {
    PROPERTY_STATUS_UNSPECIFIED = 0;
    AVAILABLE = 1;
    UNAVAILABLE = 2;
    MAINTENANCE = 3;
}

enum PropertyType {
    PROPERTY_TYPE_UNSPECIFIED = 0;
    APARTMENT = 1;
    HOUSE = 2;
    GUEST_HOUSE = 3;
    LODGE = 4;
    CAMPSITE = 5;
}

enum UserRole {
    USER_ROLE_UNSPECIFIED = 0;
    HOST = 1;
    GUEST = 2;
}

message Property {
    string property_id = 1;
    string host_id = 2;
    string name = 3;
    string location = 4;
    PropertyType property_type = 5;
    double price_per_night = 6;
    PropertyStatus status = 7;
    int32 max_guests = 8;
    string description = 9;
}

message UserProfile {
    string user_id = 1;
    string name = 2;
    string email = 3;
    UserRole role = 4;
}

message Booking {
    string booking_id = 1;
    string guest_id = 2;
    string property_id = 3;
    string property_name = 4;
    string check_in = 5;            // inclusive
    string check_out = 6;           // exclusive
    int32 nights = 7;
    double price_per_night = 8;
    double total_cost = 9;
    string confirmed_at = 10;
}

message AddPropertyRequest {
    string host_id = 1;
    string name = 2;
    string location = 3;
    PropertyType property_type = 4;
    double price_per_night = 5;
    PropertyStatus status = 6;
    int32 max_guests = 7;
    string description = 8;
}

message AddPropertyResponse {
    bool success = 1;
    string property_id = 2;
    string message = 3;
}

// Per-record failures are reported in `errors` rather than aborting the whole
// stream, so one bad profile doesn't discard the rest of the batch.
message CreateUsersResponse {
    bool success = 1;
    int32 created_count = 2;
    int32 rejected_count = 3;
    repeated string errors = 4;
    string message = 5;
}

// Empty string / zero / UNSPECIFIED means "leave this field unchanged".
// Chosen over proto3 `optional` for tooling portability; the trade-off is that
// clearing a field to empty string isn't expressible.
message UpdatePropertyRequest {
    string property_id = 1;
    string host_id = 2;
    string name = 3;
    string location = 4;
    double price_per_night = 5;
    PropertyStatus status = 6;
    int32 max_guests = 7;
    string description = 8;
}

message PropertyResponse {
    bool success = 1;
    string message = 2;
    Property property = 3;
}

message RemovePropertyRequest {
    string property_id = 1;
    string host_id = 2;
}

message PropertyList {
    repeated Property properties = 1;
    string region = 2;
    int32 count = 3;
    string message = 4;
}

message ListAvailableRequest {
    string location = 1;
    double min_price = 2;
    double max_price = 3;
    int32 min_guests = 4;
    string check_in = 5;
    string check_out = 6;
}

message SearchPropertyRequest {
    string property_id = 1;
}

message SearchPropertyResponse {
    bool found = 1;
    bool available = 2;
    string status_message = 3;
    Property property = 4;
}

message BookPropertyRequest {
    string guest_id = 1;
    string property_id = 2;
    string check_in = 3;
    string check_out = 4;
    int32 guests = 5;
}

message BookPropertyResponse {
    bool accepted = 1;
    string cart_item_id = 2;
    string message = 3;
    int32 nights = 4;
    double estimated_total = 5;
}

message ConfirmBookingRequest {
    string guest_id = 1;
    string cart_item_id = 2;        // empty = confirm the whole cart
    string idempotency_key = 3;     // lets the server filter duplicate retries
}

message BookingConfirmation {
    bool confirmed = 1;
    repeated Booking bookings = 2;
    double total_cost = 3;
    string message = 4;
    bool replayed = 5;
}
